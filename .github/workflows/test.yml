name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build and test
        run: |
          make test
          make fuzz
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD -- .

  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CC: clang
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run sanitizers
        run: make sanitize FUZZ_CASES=1000
